[project]
name = "skilllens-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.19.2",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
