services:
  db:
    image: postgres:18

    environment:
      POSTGRES_DB: skilllens
      POSTGRES_USER: skilllens
      POSTGRES_PASSWORD: skilllens_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilllens -d skilllens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://skilllens:skilllens_dev_password@db:5432/skilllens

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  postgres_data:
